name: Self-hosted release

on:
  pull_request:
    branches: [main]
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  version-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check product version and release tag
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            python3 scripts/ci/check-version.py --tag "$GITHUB_REF_NAME"
          else
            python3 scripts/ci/check-version.py
          fi

  server-image:
    needs: version-check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
      - name: Package signaling server
        run: ./kotlin package -m server -f executable-jar
      - name: Prepare image context
        run: |
          mkdir -p server-image
          cp build/tasks/_server_executableJarJvm/server-jvm-executable.jar server-image/
          cp deploy/self-host/server.Dockerfile server-image/Dockerfile
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish server image
        uses: docker/build-push-action@v7
        with:
          context: ./server-image
          platforms: linux/amd64,linux/arm64
          push: ${{ startsWith(github.ref, 'refs/tags/v') }}
          tags: ghcr.io/j1philli/shilling-server:${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || github.sha }}
          build-args: VERSION=${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || github.sha }}

  web-image:
    needs: version-check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          package-manager-cache: false
      - name: Install web dependencies
        run: npm ci
      - name: Warm SQLDelight plugin
        run: ./kotlin task :sqldelight-plugin:compileJvm
      - name: Build web app
        run: SHILLING_WASM_VARIANT=Release bash build-web.sh
      - name: Prepare self-hosted web image
        run: node scripts/ci/prepare-self-host-web.mjs
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish web image
        uses: docker/build-push-action@v7
        with:
          context: ./web-app-dist
          platforms: linux/amd64,linux/arm64
          push: ${{ startsWith(github.ref, 'refs/tags/v') }}
          tags: ghcr.io/j1philli/shilling-web:${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || github.sha }}
          build-args: VERSION=${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || github.sha }}

  github-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [server-image, web-image]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Create release assets
        run: |
          mkdir -p release-assets
          cp deploy/self-host/compose.yaml release-assets/compose.yaml
          printf 'SHILLING_VERSION=%s\n' "$GITHUB_REF_NAME" > release-assets/shilling.env.example
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_args=(
            --verify-tag
            --generate-notes
            --title "$GITHUB_REF_NAME"
            --notes "Included: self-hosted web and signaling server images for Linux amd64/arm64, plus Compose files. Mobile and desktop builds are not published by this workflow."
          )
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then release_args+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" release-assets/compose.yaml release-assets/shilling.env.example "${release_args[@]}"
