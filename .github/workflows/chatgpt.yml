name: ChatGPT protocol

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  protocol:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22.23.4
          cache: npm
          cache-dependency-path: app/chatgpt/shilling/package-lock.json
      - run: npm ci
        working-directory: app/chatgpt/shilling
      - run: npm test
        working-directory: app/chatgpt/shilling
