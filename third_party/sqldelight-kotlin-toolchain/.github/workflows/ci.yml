name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cache/JetBrains/Kotlin
            ~/Library/Caches/JetBrains/Kotlin
          key: kotlin-toolchain-${{ runner.os }}-${{ hashFiles('kotlin', '**/module.yaml', '**/plugin.yaml') }}
          restore-keys: kotlin-toolchain-${{ runner.os }}-
      - name: Build
        run: ./kotlin build
      - name: Test
        run: ./kotlin test
