# Schema derived from .sqm migrations, with migration verification.
product: jvm/lib

dependencies:
  - app.cash.sqldelight:runtime:2.4.0

test-dependencies:
  - app.cash.sqldelight:sqlite-driver:2.4.0
  - org.jetbrains.kotlin:kotlin-test:2.4.20

plugins:
  sqldelight:
    enabled: true
    packageName: com.example.migrations.db
    databaseName: NotesDatabase
    dialect: sqlite-3-38-dialect
    deriveSchemaFromMigrations: true
    verifyMigrations: true
