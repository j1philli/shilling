product: android/app

repositories:
  - id: google-maven-central-mirror
    url: https://maven-central.storage-download.googleapis.com/maven2
  - id: maven-central-canonical
    url: https://repo.maven.apache.org/maven2
  - id: google-canonical
    url: https://dl.google.com/dl/android/maven2

dependencies:
  - ../shared
  - ../shared-ui
  - $libs.coroutines.core
  - $libs.datetime
  - $libs.sqldelight.runtime
  - androidx.sqlite:sqlite-framework:2.5.1
  - androidx.sqlite:sqlite:2.5.1
  - $libs.koin.core
  - $libs.koin.compose
  - $libs.navigation.compose
  - $libs.filekit.core
  - $libs.filekit.dialogs.compose
  - $libs.compose.material3
  - $libs.compose.ui
  - $libs.compose.foundation
  - $libs.compose.runtime
  - $libs.ktor.client.okhttp
  - $libs.ktor.client.webrtc
  - $libs.ktor.client.content.negotiation
  - $libs.ktor.serialization.kotlinx.json
  - $libs.ktor.client.websockets
  - $libs.multiplatform.settings
  - $libs.multiplatform.settings.no.arg
  - $libs.kermit
  - $libs.activity.compose

settings:
  compose:
    enabled: true
    version: 1.12.0
  kotlin:
    version: "2.4.20"
  android:
    compileSdk: 36
    minSdk: 28
    targetSdk: 35
    namespace: finance.shilling.android
    applicationId: finance.shilling.android
    versionName: "0.1.0"
    versionCode: 1
